<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人介紹 | 張竣彥</title>
    <style>
        /* 全局樣式重置與字體設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 個人卡片容器 */
        .profile-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            text-align: center;
            padding: 30px 20px;
            transition: transform 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-5px);
        }

        /* 大頭貼區域 */
        .avatar-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #eef2f5;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 姓名與身分標籤 */
        .name {
            font-size: 1.8rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .tag-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tag {
            background-color: #e3f2fd;
            color: #1976d2;
            font-size: 0.85rem;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 500;
        }

        /* 自我介紹區域 */
        .bio {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #555;
            text-align: justify;
            background-color: #fafafa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #1976d2;
            margin-bottom: 20px;
        }

        /* 社群與聯絡按鈕 */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .btn {
            text-decoration: none;
            color: #fff;
            background-color: #333;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: #555;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- 1. 大頭貼區域 -->
        <div class="avatar-container">
            <!-- 替換成你的照片檔名，例如 "profile.jpg" -->
            <img src="https://via.placeholder.com/150" alt="張竣彥的大頭貼">
        </div>

        <!-- 2. 姓名與標籤區域 -->
        <h1 class="name">張竣彥</h1>
        <div class="tag-container">
            <span class="tag">🎓 勤益科技大學</span>
            <span class="tag">資訊管理系</span>
            <span class="tag">大二生</span>
        </div>

        <!-- 3. 自我介紹文字區域 -->
        <div class="bio">
            <p>你好！我是張竣彥，目前就讀國立勤益科技大學資訊管理系二年級。</p>
        </div>

        <!-- 4. 聯絡連結 -->
        <div class="social-links">
            <a href="#" class="btn">GitHub</a>
            <a href="#" class="btn">Instagram</a>
            <a href="mailto:your-email@gmail.com" class="btn">Email</a>
        </div>
    </div>

</body>
</html>
